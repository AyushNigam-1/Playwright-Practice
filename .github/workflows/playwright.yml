steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🧪 Execute Playwright Suite
        run: npx playwright test

      # ==========================================
      # PHASE 1: Artifact Extraction
      # ==========================================
      - name: 📤 Upload HTML Report & Traces
        uses: actions/upload-artifact@v4
        # always() ensures this runs even if the previous step (Execute) fails
        if: always() 
        with:
          name: playwright-ci-report
          path: playwright-report/
          # DevOps Best Practice: Don't bloat your GitHub storage bill. 
          # Ephemeral test reports only need to live for a few days.
          retention-days: 3

      # ==========================================
      # PHASE 2: The Alert System (Webhook)
      # ==========================================
      - name: 🚨 Notify Team on Failure
        # failure() ensures we ONLY spam the chat if the build broke
        if: failure() 
        env:
          # In reality, this is stored securely in GitHub Secrets
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }} 
        run: |
          # We use a raw cURL command to POST a JSON payload to the webhook
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "content": "🚨 **E2E Pipeline Failed!**\n**Commit:** `${{ github.sha }}`\n**Author:** `${{ github.actor }}`\n**View Report:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
               }' \
               $WEBHOOK_URL